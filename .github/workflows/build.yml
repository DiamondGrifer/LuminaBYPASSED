name: Build Lumina APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip LuminaClient.zip
        run: |
          if [ -f LuminaClient.zip ]; then
            unzip -o LuminaClient.zip -d LuminaSource
            cp -r LuminaSource/*/* . 2>/dev/null || cp -r LuminaSource/* . 2>/dev/null || true
          else
            echo "❌ LuminaClient.zip не найден!"
            exit 1
          fi

      - name: Create google-services.json
        run: |
          mkdir -p app
          echo '{
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.projectlumina.luminaclient"
                  }
                }
              }
            ],
            "configuration_version": "1"
          }' > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Patched
          path: app/build/outputs/apk/debug/*.apk
